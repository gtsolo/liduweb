<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>示例网站首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- 顶部导航 -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="text-2xl font-bold text-blue-600">MySite</div>
      <nav class="space-x-6 text-gray-600">
        <a href="#" class="hover:text-blue-600">首页</a>
        <a href="#" class="hover:text-blue-600">产品</a>
        <a href="#" class="hover:text-blue-600">服务</a>
        <a href="#" class="hover:text-blue-600">关于我们</a>
        <a href="#" class="hover:text-blue-600">联系我们</a>
      </nav>
    </div>
  </header>

  <!-- 横幅区域 -->
  <section class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white">
    <div class="max-w-7xl mx-auto px-6 py-24 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-6">专业 · 高效 · 可信赖</h1>
      <p class="text-lg md:text-xl mb-8 opacity-90">为您提供现代化、智能化的一站式解决方案</p>
      <div class="space-x-4">
        <a href="#" class="bg-white text-blue-600 px-6 py-3 rounded-xl font-medium hover:bg-gray-100">立即开始</a>
        <a href="#" class="border border-white px-6 py-3 rounded-xl font-medium hover:bg-white hover:text-blue-600">了解更多</a>
      </div>
    </div>
  </section>

  <!-- 核心优势 -->
  <section class="py-20">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-3xl font-bold text-center mb-12">我们的优势</h2>
      <div class="grid md:grid-cols-3 gap-8">
        <div class="bg-white p-8 rounded-2xl shadow hover:shadow-lg transition">
          <h3 class="text-xl font-semibold mb-3">设计美观</h3>
          <p class="text-gray-600">遵循现代审美，界面简洁大方，提升用户体验。</p>
        </div>
        <div class="bg-white p-8 rounded-2xl shadow hover:shadow-lg transition">
          <h3 class="text-xl font-semibold mb-3">技术可靠</h3>
          <p class="text-gray-600">采用成熟稳定的技术架构，保障系统安全与性能。</p>
        </div>
        <div class="bg-white p-8 rounded-2xl shadow hover:shadow-lg transition">
          <h3 class="text-xl font-semibold mb-3">服务专业</h3>
          <p class="text-gray-600">专注客户需求，提供持续、高质量的技术支持。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 行动号召 -->
  <section class="bg-blue-600 text-white py-16">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-3xl font-bold mb-4">准备好开始了吗？</h2>
      <p class="mb-6 opacity-90">让我们一起打造高品质的数字化产品</p>
      <a href="#" class="bg-white text-blue-600 px-8 py-3 rounded-xl font-medium hover:bg-gray-100">联系我们</a>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="bg-gray-900 text-gray-400 py-10">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center">
      <p>© 2026 MySite. 保留所有权利</p>
      <div class="space-x-4 mt-4 md:mt-0">
        <a href="#" class="hover:text-white">隐私政策</a>
        <a href="#" class="hover:text-white">使用条款</a>
      </div>
    </div>
  </footer>

</body>
</html>
